<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWEB1 — Cap. 05 — AT01 — Formulário de Contato</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #f9f5fb;
            --ink: #3b2240;
            --primary: #A47DAB;
            --accent: #c9a8d1;
            --highlight: #e8d6ec;
            --text-body: #4a2f52;
            --muted: #8a6b90;
            --card: #ffffff;
            --border: #dccfe0;
            --radius: 6px;
            --shadow: 0 2px 12px rgba(59, 34, 64, .07);
            --transition: .2s ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            background: var(--ink);
            padding: 2.5rem 2rem 2rem;
        }

        .page-header p.breadcrumb {
            font-size: .72rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: .6rem;
        }

        .page-header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: #fff;
            line-height: 1.15;
        }

        .page-header h1 span {
            color: var(--accent);
            font-style: italic;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            color: var(--accent);
            text-decoration: none;
            font-size: .78rem;
            font-weight: 500;
            margin-top: .9rem;
            letter-spacing: .06em;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: #fff;
        }

        /* ── MAIN ── */
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }

        /* ── FORM CARD ── */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.4rem;
            box-shadow: var(--shadow);
        }

        .form-card .section-label {
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: .4rem;
        }

        .form-card h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.4rem;
            color: var(--ink);
            margin-bottom: 1.8rem;
        }

        /* ── FIELD GROUP ── */
        .field {
            display: flex;
            flex-direction: column;
            gap: .4rem;
            margin-bottom: 1.4rem;
        }

        label {
            font-size: .85rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: .02em;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: .65rem .9rem;
            font-family: 'DM Sans', sans-serif;
            font-size: .92rem;
            color: var(--text-body);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(164, 125, 171, .2);
        }

        textarea {
            resize: vertical;
            line-height: 1.6;
        }

        .btn-submit {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: .75rem 1.8rem;
            font-family: 'DM Sans', sans-serif;
            font-size: .9rem;
            font-weight: 600;
            letter-spacing: .04em;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
            margin-top: .4rem;
        }

        .btn-submit:hover,
        .btn-submit:focus-visible {
            background: var(--ink);
            transform: translateY(-2px);
            outline: none;
        }

        /* ── PAGE FOOTER ── */
        .page-footer {
            background: var(--ink);
            color: var(--muted);
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: .78rem;
        }
    </style>
</head>

<body>

    <header class="page-header">
        <p class="breadcrumb">Cap. 5 &mdash; Atividade 01</p>
        <h1>Formulário de <span>Contato</span></h1>
        <a class="back-link" href="../index.html">&#8592; Voltar para a página principal</a>
    </header>

    <main>
        <div class="form-card">
            <p class="section-label">Fale conosco</p>
            <h2>Entre em Contato</h2>

            
            <form action="https://httpbin.org/get" method="get" novalidate>

                <div class="field">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex.: Maria da Silva" autocomplete="name"
                        required />
                </div>

                <div class="field">
                    <label for="email">Endereço de e-mail</label>
                    <input type="email" id="email" name="email" placeholder="Ex.: maria@exemplo.com"
                        autocomplete="email" required />
                </div>

                <div class="field">
                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" name="assunto" placeholder="Ex.: Dúvida sobre matrícula" required />
                </div>

                <div class="field">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui…"
                        required></textarea>
                </div>

                <button class="btn-submit" type="submit">Enviar mensagem</button>

            </form>
        </div>
    </main>

    <footer class="page-footer">
        <p>Cap. 5 / AT01 &mdash; Emily Cecilia Souza da Silva &mdash; IFAL &mdash; 2025</p>
    </footer>

</body>

</html>
