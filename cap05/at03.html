<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWEB1 — Cap. 05 — AT03 — Matrícula Acadêmica</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #f9f5fb;
            --ink: #3b2240;
            --primary: #A47DAB;
            --accent: #c9a8d1;
            --highlight: #e8d6ec;
            --text-body: #4a2f52;
            --muted: #8a6b90;
            --card: #ffffff;
            --border: #dccfe0;
            --radius: 6px;
            --shadow: 0 2px 12px rgba(59, 34, 64, .07);
            --transition: .2s ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .page-header {
            background: var(--ink);
            padding: 2.5rem 2rem 2rem;
        }

        .page-header p.breadcrumb {
            font-size: .72rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: .6rem;
        }

        .page-header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: #fff;
            line-height: 1.15;
        }

        .page-header h1 span {
            color: var(--accent);
            font-style: italic;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            color: var(--accent);
            text-decoration: none;
            font-size: .78rem;
            font-weight: 500;
            margin-top: .9rem;
            letter-spacing: .06em;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: #fff;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }

        /* ── REQUIRED NOTE ── */
        .required-note {
            font-size: .8rem;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .required-note span {
            color: var(--primary);
            font-weight: 700;
        }

        /* ── FIELDSET CARD ── */
        fieldset {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.8rem;
        }

        legend {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: var(--ink);
            padding: 0 .6rem;
            letter-spacing: .01em;
        }

        /* Fieldset aninhado (período) */
        fieldset fieldset {
            background: var(--bg);
            box-shadow: none;
            padding: 1rem 1.2rem;
            margin-top: 1.2rem;
            margin-bottom: 0;
        }

        fieldset fieldset legend {
            font-family: 'DM Sans', sans-serif;
            font-size: .82rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: .06em;
        }

        /* ── FIELD ── */
        .field {
            display: flex;
            flex-direction: column;
            gap: .38rem;
            margin-top: 1.2rem;
        }

        label {
            font-size: .84rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: .02em;
        }

        .req {
            color: var(--primary);
            margin-left: .1rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: .65rem .9rem;
            font-family: 'DM Sans', sans-serif;
            font-size: .9rem;
            color: var(--text-body);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(164, 125, 171, .2);
        }

        select {
            cursor: pointer;
        }

        /* ── RADIO GROUP ── */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem 1.6rem;
            margin-top: .7rem;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: .45rem;
            font-weight: 400;
            cursor: pointer;
            font-size: .88rem;
            color: var(--text-body);
        }

        input[type="radio"] {
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
        }

        /* ── CHECKBOX GRID ── */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: .55rem;
            margin-top: .8rem;
        }

        .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-weight: 400;
            cursor: pointer;
            font-size: .87rem;
            color: var(--text-body);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: .5rem .8rem;
            transition: background var(--transition), border-color var(--transition);
        }

        .checkbox-grid label:has(input:checked) {
            background: var(--highlight);
            border-color: var(--primary);
        }

        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        /* ── BUTTONS ── */
        .btn-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: .4rem;
        }

        .btn-submit,
        .btn-reset {
            padding: .72rem 1.6rem;
            font-family: 'DM Sans', sans-serif;
            font-size: .88rem;
            font-weight: 600;
            letter-spacing: .04em;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
        }

        .btn-submit {
            background: var(--primary);
            color: #fff;
        }

        .btn-submit:hover,
        .btn-submit:focus-visible {
            background: var(--ink);
            transform: translateY(-2px);
            outline: none;
        }

        .btn-reset {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--accent);
        }

        .btn-reset:hover {
            background: var(--highlight);
        }

        .page-footer {
            background: var(--ink);
            color: var(--muted);
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: .78rem;
        }
    </style>
</head>

<body>

    <header class="page-header">
        <p class="breadcrumb">Cap. 5 &mdash; Atividade 03</p>
        <h1>Matrícula <span>Acadêmica</span></h1>
        <a class="back-link" href="../index.html">&#8592; Voltar para a página principal</a>
    </header>

    <main>
        <p class="required-note"><span>*</span> Campos obrigatórios</p>

        <form action="https://httpbin.org/post" method="post">

            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="field">
                    <label for="nome">Nome completo <span class="req">*</span></label>
                    <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Ex.: Ana Beatriz Lima"
                        required minlength="5" maxlength="100" />
                </div>

                <div class="field">
                    <label for="cpf">CPF <span class="req">*</span></label>
           
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="CPF no formato 000.000.000-00" autocomplete="off"
                        required />
                </div>

                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(82) 99999-9999"
                        pattern="\(\d{2}\)\s\d{4,5}-\d{4}" title="Telefone no formato (82) 99999-9999"
                        autocomplete="tel" />
                </div>

                <div class="field">
                    <label for="email">E-mail <span class="req">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Ex.: ana@exemplo.com" autocomplete="email"
                        required />
                </div>
            </fieldset>

            <fieldset>
                <legend>Dados Acadêmicos</legend>

                <div class="field">
                    <label for="curso">Curso pretendido <span class="req">*</span></label>
              
                    <select id="curso" name="curso" required>
                        <option value="" disabled selected>Selecione um curso…</option>
                        <optgroup label="Computação">
                            <option value="si">Sistemas de Informação</option>
                            <option value="cc">Ciência da Computação</option>
                            <option value="ec">Engenharia da Computação</option>
                        </optgroup>
                        <optgroup label="Gestão">
                            <option value="adm">Administração</option>
                            <option value="cont">Ciências Contábeis</option>
                        </optgroup>
                    </select>
                </div>

                <fieldset>
                    <legend>Período preferido</legend>
                    <div class="radio-group">
                        <label><input type="radio" name="periodo" value="manha" required /> Manhã</label>
                        <label><input type="radio" name="periodo" value="tarde" /> Tarde</label>
                        <label><input type="radio" name="periodo" value="noite" /> Noite</label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="ano_ingresso">Ano de ingresso pretendido <span class="req">*</span></label>
                    <input type="number" id="ano_ingresso" name="ano_ingresso" min="2025" max="2030" placeholder="2025"
                        required />
                </div>
            </fieldset>

            <fieldset>
                <legend>Áreas de Interesse</legend>

                <div class="checkbox-grid">
                    <label>
                        <input type="checkbox" name="interesses[]" value="web" />
                        Desenvolvimento Web
                    </label>
                    <label>
                        <input type="checkbox" name="interesses[]" value="bd" />
                        Banco de Dados
                    </label>
                    <label>
                        <input type="checkbox" name="interesses[]" value="ia" />
                        Metedologia cientifica
                    </label>
                    <label>
                        <input type="checkbox" name="interesses[]" value="seg" />
                        Programação Orietada a Objetos
                    </label>
                    <label>
                        <input type="checkbox" name="interesses[]" value="infra" />
                        Redes de Computadores
                    </label>
                    <label>
                        <input type="checkbox" name="interesses[]" value="mobile" />
                            Estrutura de Dados
                        </label>
                    <label>
                        <input type="checkbox" name="interesses[]" value="dados" />
                            Linguagem de Programação
                        </label>
                    <label>
                        <input type="checkbox" name="interesses[]" value="dados" />
                        Processo de Desenvolvimento de Software
                    </label>
                </div>
            </fieldset>

            <div class="btn-row">
                <button class="btn-submit" type="submit">Solicitar matrícula</button>
                <button class="btn-reset" type="reset">Limpar formulário</button>
            </div>

        </form>
    </main>

    <footer class="page-footer">
        <p>Cap. 5 / AT03 &mdash; Emily Cecilia Souza da Silva &mdash; IFAL &mdash; 2025</p>
    </footer>

</body>

</html>
